name: ML Pipeline

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull Data
        run: echo "Data will be auto-downloaded by train.py if not present"

      - name: Train model
        env:
          MOCK_ACCURACY: "0.88"
        run: python train.py --epochs 1 --batch_size 100

      - name: Verify model_info.txt
        run: |
          echo "=== model_info.txt ==="
          cat model_info.txt

      - name: Persist model_info.txt
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: model_info.txt

      - name: Persist mlruns
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlruns-folder
          path: mlruns/

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model_info.txt
        uses: actions/download-artifact@v4
        with:
          name: model-info

      - name: Download mlruns
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mlruns-folder
          path: mlruns/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MLflow
        run: pip install mlflow

      - name: Logic — check accuracy threshold
        run: python check_threshold.py

      - name: Containerize — mock Docker build
        run: |
          RUN_ID=$(head -n 1 model_info.txt)
          echo "Building Docker image for Run ID: $RUN_ID"
          docker build --build-arg RUN_ID=$RUN_ID -t mock-model:$RUN_ID .